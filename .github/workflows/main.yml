name: Prompt Zen Daily Research

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Research
        run: python main.py
